<!DOCTYPE html>
<html lang="en" class="lock">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffd9ec">
<title>Happy Birthday Supriya 🎂</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Great+Vibes&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{--ink:#7a3b69;--pink:#ff5fa2;--soft:#ff8fbd;--script:'Pacifico','Brush Script MT',cursive;--ui:'Fredoka','Trebuchet MS',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html.lock,html.lock body{overflow:hidden;height:100%}
html,body{min-height:100%;overflow-x:hidden}
body{font-family:var(--ui);color:var(--ink)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(135deg,#ffd9ec,#eadcff,#ffeccc,#d3f1ff)}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none}
#sky{z-index:1}#rain{z-index:2;transition:opacity 2.4s ease-out}#rain.off{opacity:0}#pop{z-index:50}
.blob{position:fixed;border-radius:50%;opacity:.6;will-change:transform;z-index:0;animation:drift 16s ease-in-out infinite alternate}
.b1{width:60vmax;height:60vmax;left:-20vmax;top:-18vmax;background:radial-gradient(#ffb3d9,transparent 65%)}
.b2{width:55vmax;height:55vmax;right:-22vmax;top:25%;background:radial-gradient(#cdb8ff,transparent 65%);animation-delay:-5s}
.b3{width:50vmax;height:50vmax;left:10%;bottom:-25vmax;background:radial-gradient(#ffe2a8,transparent 65%);animation-delay:-9s}
@keyframes drift{to{transform:translate(6vmax,-4vmax) scale(1.12)}}
.bl{position:fixed;bottom:-70px;z-index:1;opacity:.8;pointer-events:none;animation:up linear infinite}
@keyframes up{to{transform:translateY(-125vh) rotate(14deg)}}
.lite .blob,.lite .bl,.lite #sky,.lite #rain,.lite #veil{display:none}
.hidden{display:none!important}
.screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;padding:16px;transition:opacity .8s ease}
.screen.fade-away{opacity:0;pointer-events:none}
.glass{background:rgba(255,255,255,.34);-webkit-backdrop-filter:blur(16px) saturate(1.4);backdrop-filter:blur(16px) saturate(1.4);border:1.5px solid rgba(255,255,255,.75);box-shadow:0 12px 40px rgba(255,95,162,.22),inset 0 1px 0 rgba(255,255,255,.8)}
button{font:inherit;cursor:pointer;border:0}
.btn{background:linear-gradient(135deg,#ff8fc0,#ff5fa2);color:#fff;font-weight:600;font-size:1.1rem;padding:14px 32px;border-radius:50px;box-shadow:0 8px 22px rgba(255,95,162,.45),inset 0 2px 0 rgba(255,255,255,.5);transition:transform .2s}
.btn:active{transform:scale(.94)}
.card{border-radius:32px;padding:30px 28px;max-width:340px;animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-8px)}}
.startTxt{font-family:var(--ui);font-weight:500;font-size:1.5rem;line-height:1.4;margin-bottom:22px;color:var(--ink)}
.ring{width:min(58vw,230px);aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.3);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:2px solid rgba(255,255,255,.85);box-shadow:0 0 0 12px rgba(255,255,255,.2),0 14px 50px rgba(255,95,162,.35)}
#cn{font-family:var(--script);font-size:clamp(5rem,26vw,8rem);color:#fff;text-shadow:0 4px 0 var(--soft),0 8px 0 var(--pink),0 14px 26px rgba(255,95,162,.5)}
.pulse{animation:pulse .9s ease both}
@keyframes pulse{0%{opacity:0;transform:scale(.4)}35%{opacity:1;transform:scale(1.12)}100%{opacity:1;transform:scale(1)}}
#word{font-family:'Great Vibes','Snell Roundhand',cursive;font-weight:400}
#word .h{display:block;font-size:clamp(2.8rem,13vw,5.2rem);line-height:1.15;color:#fff6cf;text-shadow:0 0 3px #fff,0 0 9px #ffe08a,0 0 20px #ffc83d,0 0 38px #ffae00,0 0 64px rgba(255,174,0,.75)}
#word #wName{display:block;margin-top:16px;font-family:var(--ui);font-weight:500;font-size:clamp(2.4rem,14vw,5.6rem);letter-spacing:.1em;color:#ff8fc0;text-transform:uppercase}
#veil{position:fixed;inset:0;z-index:3;background:linear-gradient(160deg,#3d1236,#8a2a6b 55%,#d4527f);opacity:0;transition:opacity 1.2s;pointer-events:none}#veil.on{opacity:1}
#heartWrap{overflow:hidden}
#word.slow{animation:slow 2.4s ease both}
@keyframes slow{from{opacity:0;transform:scale(.88)}to{opacity:1;transform:scale(1)}}
#heart{width:min(44vw,200px);animation:hdrop 2.9s linear both}
@keyframes hdrop{0%{transform:translateY(-65vh);animation-timing-function:linear}35%{transform:translateY(0) scale(1);animation-timing-function:ease-in}100%{transform:translateY(0) scale(16)}}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.16)}}
#cake{width:min(64vw,270px);animation:pop .7s cubic-bezier(.2,1.6,.4,1) both,bob 2.6s ease-in-out .7s infinite;filter:drop-shadow(0 14px 22px rgba(255,95,162,.35))}
@keyframes pop{from{transform:scale(0) rotate(-20deg)}to{transform:none}}
@keyframes bob{50%{transform:translateY(-10px) rotate(2deg)}}
.fk{transform-origin:100px 58px;animation:fk .45s ease-in-out infinite alternate}
@keyframes fk{to{transform:scale(1.12,.9) rotate(4deg)}}
#musicBtn{position:fixed;z-index:100;top:calc(env(safe-area-inset-top,0px) + 12px);left:12px;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border:1.5px solid #fff;box-shadow:0 4px 14px rgba(255,95,162,.3)}
#musicBtn svg{width:20px;height:20px;fill:var(--pink)}
#musicBtn.playing #icoPlay,#musicBtn:not(.playing) #icoPause{display:none}
/* album */
#album.enter{animation:albumIn 1.1s cubic-bezier(.2,.7,.2,1) backwards}
@keyframes albumIn{from{opacity:0;transform:translateY(26px) scale(.9)}to{opacity:1;transform:none}}
#album{transition:transform 1s ease,opacity 1s ease}#album.leaving{transform:translateX(-115vw);opacity:0}
#stage{position:relative;width:min(94vw,520px)}
#bookShift{transform:translateX(-25%);transition:transform 1.35s cubic-bezier(.65,0,.25,1)}
#bookShift.opened{transform:none}
#book{position:relative;width:100%;aspect-ratio:3/2;display:flex;perspective:1500px;cursor:pointer}
.pg{position:relative;width:50%;height:100%;overflow:hidden}
.pg.left{visibility:hidden;border-radius:14px 0 0 14px}.pg.right{border-radius:0 14px 14px 0}
#book.ready .pg.left{visibility:visible}
.pg,.fl>div,.cv>.bk{background:#fff7fb;padding:5%;box-shadow:0 10px 30px rgba(255,95,162,.3)}
.pg::after{content:"";position:absolute;top:0;bottom:0;width:14%;pointer-events:none}
.pg.left::after{right:0;background:linear-gradient(to left,rgba(122,59,105,.2),transparent)}
.pg.right::after{left:0;background:linear-gradient(to right,rgba(122,59,105,.2),transparent)}
.ph{width:100%;height:100%;border-radius:10px;background:linear-gradient(135deg,var(--a),var(--b)) center/cover;display:grid;place-items:center;border:2px solid #fff;box-shadow:0 2px 8px rgba(122,59,105,.18)}
.ph b{font-size:clamp(1.6rem,9vw,3rem);font-weight:400;opacity:.9}
.fl{position:absolute;top:0;width:50%;height:100%;transform-style:preserve-3d;transition:transform .9s ease-in-out}
.fl.r{left:50%;transform-origin:left center}.fl.l{left:0;transform-origin:right center}
.fl>div,.cv>div{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.fl>.bk,.cv>.bk{transform:rotateY(180deg)}
.cv{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform 1.35s cubic-bezier(.65,0,.25,1);z-index:3}
#bookShift.opened .cv{transform:rotateY(-180deg)}#book.ready .cv{display:none}
.cv>.ft{border-radius:4px 16px 16px 4px;background:radial-gradient(circle at 20% 15%,#fff 0 3px,transparent 4px) 0 0/22px 22px,linear-gradient(145deg,#ffb3d4,#ff7fb5);box-shadow:0 10px 30px rgba(255,95,162,.5);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;animation:glow 2.4s ease-in-out infinite}
.cv>.ft::before{content:"";position:absolute;inset:8px;border:2px dashed rgba(255,255,255,.85);border-radius:3px 11px 11px 3px}
.cv>.ft::after{content:"";position:absolute;top:0;bottom:0;left:0;width:9%;background:linear-gradient(to right,rgba(122,59,105,.25),rgba(255,255,255,.2) 55%,transparent)}
.cv .t1{font-family:var(--script);font-size:clamp(1.3rem,6vw,2rem);line-height:1.2;text-shadow:0 2px 0 var(--pink);padding:0 10px}
.cv .t2{font-size:clamp(1.6rem,7vw,2.4rem);margin:4px 0}
#bookShift.opened .cv>.ft{animation:none}
@keyframes glow{50%{box-shadow:0 10px 38px rgba(255,255,255,.9)}}
.tap{position:absolute;left:50%;bottom:9%;transform:translateX(-50%);white-space:nowrap;padding:6px 16px;border-radius:30px;background:rgba(255,255,255,.4);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:1px solid #fff;font-family:var(--script);font-size:clamp(.9rem,4vw,1.2rem);animation:breathe 1.8s ease-in-out infinite;transition:opacity .5s;z-index:2}
#bookShift.opened .tap{opacity:0;animation:none}
@keyframes breathe{50%{transform:translateX(-50%) scale(1.08)}}
#msg{position:absolute;left:50%;bottom:calc(100% + 22px);width:100%;min-height:70px;border-radius:22px;padding:16px 34px 16px 18px;font-family:var(--script);font-size:1.15rem;line-height:1.5;color:var(--ink);background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1.5px solid #fff;box-shadow:0 8px 26px rgba(255,95,162,.25);opacity:0;transform:translate(-50%,14px);transition:opacity .9s,transform .9s;pointer-events:none}
#msg.show{opacity:1;transform:translate(-50%,0)}
.mh{position:absolute;top:6px;right:10px;font-size:.8rem;font-style:normal}
#turnHint{position:absolute;left:0;right:0;top:calc(100% + 18px);font-size:.85rem;font-weight:500;opacity:0;transition:opacity .9s}#turnHint.show{opacity:.7}
/* finale */
#finale{display:none;position:relative;height:2400vh;z-index:4;pointer-events:none}#finale.active{display:block}
#scrollHint{position:fixed;z-index:8;left:50%;bottom:calc(10vh + env(safe-area-inset-bottom,0px));transform:translateX(-50%);white-space:nowrap;padding:10px 22px;border-radius:40px;font-weight:500;color:var(--ink);background:rgba(255,255,255,.45);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border:1.5px solid #fff;box-shadow:0 6px 22px rgba(255,95,162,.3);transition:opacity .7s;animation:nudge 1.8s ease-in-out infinite}
@keyframes nudge{50%{margin-bottom:8px}}
#heartStage{position:fixed;inset:0;overflow:hidden;transition:opacity .9s,filter .9s}
#heartStage.dim{opacity:.3;filter:blur(3px)}
#heartInner.beat{animation:beat2 1.3s ease-in-out infinite}
@keyframes beat2{50%{transform:scale(1.04)}}
#heartInner{position:absolute;inset:0;will-change:transform}
.hp{position:absolute;left:0;top:0;opacity:0;will-change:transform}
.hp .ph{border:14px solid #fff;border-radius:44px;box-shadow:0 10px 26px rgba(255,95,162,.4)}.hp .ph b{font-size:5rem}
#finalMessage{position:fixed;z-index:20;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);width:min(90vw,460px);text-align:center;opacity:0;transition:opacity .9s,transform .9s;pointer-events:none}
#finalMessage.visible{opacity:1;transform:translate(-50%,-50%) scale(1)}
#finalMessage.visible button{pointer-events:auto}
#fcake{width:min(36vw,150px);display:block;margin:0 auto -18px;position:relative;z-index:1;animation:bob 2.6s ease-in-out infinite}
.finalCard{border-radius:28px;padding:34px 22px 22px;font-family:var(--script);font-size:clamp(1.1rem,4.4vw,1.5rem);line-height:1.7;background:rgba(255,255,255,.5)}
.finalCard p+p{margin-top:6px}.finalCard .btn{margin-top:16px;font-family:var(--ui);font-size:.95rem;padding:10px 24px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div id="veil"></div>
<canvas id="sky"></canvas><canvas id="rain"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="hg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5470"/><stop offset="1" stop-color="#e0173d"/></linearGradient>

</symbol></defs></svg>

<div id="start" class="screen"><div class="glass card"><p class="startTxt">Are you ready for the surprise?</p><button id="startBtn" class="btn">Yes</button></div></div>

<script>
/* ===== EDIT ME ===== */
const C={
 name:"Supriya",
 // files in the same folder as index.html
 music:"birthday-music.mp3",
 character:"demo-character.png",
 character2:"demo-character2.png",
 // 8 album photos (demo-photo-01.jpg ... demo-photo-08.jpg)
 album:["demo-photo-01.jpg","demo-photo-02.jpg","demo-photo-03.jpg","demo-photo-04.jpg","demo-photo-05.jpg","demo-photo-06.jpg","demo-photo-07.jpg","demo-photo-08.jpg"],
 // 20 photos that form the heart (heart-01.jpg ... heart-20.jpg)
 heart:["heart-01.jpg","heart-02.jpg","heart-03.jpg","heart-04.jpg","heart-05.jpg","heart-06.jpg","heart-07.jpg","heart-08.jpg","heart-09.jpg","heart-10.jpg","heart-11.jpg","heart-12.jpg","heart-13.jpg","heart-14.jpg","heart-15.jpg","heart-16.jpg","heart-17.jpg","heart-18.jpg","heart-19.jpg","heart-20.jpg"],
 texts:["Happy birthday, my love ❤","As long as you’re smiling, I’m happy.","You make every day brighter ✨","Here’s to us, forever 💖"],
 final:["Sorry,Yeh website kal tak banana tha but ho nhi paya","I hope aaj ka din yaadgaar ho tere liye ","Happy Birthday, Supriya — my jaanu❤️ "]
};
/* =================== */
const $=id=>document.getElementById(id),sleep=ms=>new Promise(r=>setTimeout(r,ms)),rnd=Math.random,clamp=v=>Math.min(1,Math.max(0,v));
const PAL=[["#ffc2dd","#ff8fbd"],["#e3d0ff","#b9a0ff"],["#ffe3b3","#ffb98a"],["#c9f3ff","#8fd8f5"],["#d3f8e2","#8fe0b4"]],EM=["🎀","🧁","🌸","🎈","💖","🍓","✨","🦋"];
const ph=(s,k)=>{const p=PAL[k%5];return `<div class="ph" style="--a:${p[0]};--b:${p[1]}${s?`;background-image:url('${s}')`:""}">${s?"":`<b>${EM[k%8]}</b>`}</div>`};

/* floating balloons */
["🎈","🎀","🎈","✨","🧁","🎈","💗","🎀","🎈"].forEach((e,i)=>{const b=document.createElement("i");b.className="bl";b.textContent=e;b.style.cssText=`left:${i*11+rnd()*6}%;font-size:${22+rnd()*30}px;animation-duration:${14+rnd()*12}s;animation-delay:${-rnd()*22}s`;document.body.append(b)});

/* music: Happy Birthday played on a soft music-box synth (no audio file) */
let AC,master,timer,ni=0,nt=0;const Q=.46;
const T=[[392,.75],[392,.25],[440,1],[392,1],[523.25,1],[493.88,2],[392,.75],[392,.25],[440,1],[392,1],[587.33,1],[523.25,2],[392,.75],[392,.25],[783.99,1],[659.25,1],[523.25,1],[493.88,1],[440,2],[698.46,.75],[698.46,.25],[659.25,1],[523.25,1],[587.33,1],[523.25,2]];
function initAudio(){if(AC)return;AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=.2;const d=AC.createDelay(),fb=AC.createGain();d.delayTime.value=.3;fb.gain.value=.32;d.connect(fb);fb.connect(d);master.connect(AC.destination);master.connect(d);d.connect(AC.destination);}
function note(f,t,d){[[f,1,"sine"],[f*2,.25,"triangle"]].forEach(([fr,v,ty])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=ty;o.frequency.value=fr;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.001,t+d*1.5);o.connect(g);g.connect(master);o.start(t);o.stop(t+d*1.6)})}
function sched(){while(nt<AC.currentTime+.6){const[f,b]=T[ni];note(f,nt,b*Q);nt+=b*Q;if(++ni>=T.length){ni=0;nt+=Q*2}}}
function startMusic(){music.muted=false;music.currentTime=0;music.play().catch(()=>{})}
const music=new Audio(C.music);music.loop=true;music.preload="auto";
music.onplay=()=>$("musicBtn").classList.add("playing");music.onpause=()=>$("musicBtn").classList.remove("playing");
$("musicBtn").onclick=()=>music.paused?music.play().catch(()=>{}):music.pause();
function unlock(){music.muted=true;const p=music.play(),f=()=>{music.pause();music.currentTime=0;music.muted=false};p?p.then(f).catch(()=>{music.muted=false}):f()}
function popSnd(){if(!AC)return;const n=AC.sampleRate*.25|0,b=AC.createBuffer(1,n,AC.sampleRate),d=b.getChannelData(0);for(let i=0;i<n;i++)d[i]=(rnd()*2-1)*Math.pow(1-i/n,4);const s=AC.createBufferSource(),g=AC.createGain();s.buffer=b;g.gain.value=1.2;s.connect(g);g.connect(AC.destination);s.start()}

/* letter shower */
const rain=$("rain"),rc=rain.getContext("2d");let lite=false,rainOn=true,rate=.22,LT=[];
const CH=(C.name.toUpperCase()+"HAPPYBIRTHDAY").split("").concat(["♥","✿","★"]),RC=["#ff5fa2","#ff8fbd","#b9a0ff","#ffb347","#6fd3f5","#fff"];
const sz=()=>{rain.width=innerWidth;rain.height=innerHeight};sz();
(function r(){if(lite)return;rc.clearRect(0,0,rain.width,rain.height);
 if(rainOn&&rnd()<rate)LT.push({x:rnd()*rain.width,y:-30,v:1.4+rnd()*2.6,s:16+rnd()*24,c:RC[rnd()*RC.length|0],ch:CH[rnd()*CH.length|0],a:rnd()*6,w:rnd()*6,vr:rnd()*.04-.02});
 LT.forEach(l=>{l.y+=l.v;l.x+=Math.sin(l.y/45+l.w)*.7;l.a+=l.vr;rc.save();rc.translate(l.x,l.y);rc.rotate(l.a);rc.font=`600 ${l.s}px Fredoka,sans-serif`;rc.fillStyle=l.c;rc.globalAlpha=.85;rc.fillText(l.ch,0,0);rc.restore()});
 LT=LT.filter(l=>l.y<rain.height+40);requestAnimationFrame(r)})();

/* sparkles */
const sk=$("sky"),sx=sk.getContext("2d");let S=[];
const sz2=()=>{sk.width=innerWidth;sk.height=innerHeight;S=Array.from({length:60},()=>({x:rnd()*sk.width,y:rnd()*sk.height,r:rnd()*2+.8,p:rnd()*6,c:["#fff","#ffd0ea","#fff3b0"][rnd()*3|0]}))};sz2();
(function d(t){if(lite)return;sx.clearRect(0,0,sk.width,sk.height);S.forEach(s=>{sx.globalAlpha=.25+.75*Math.abs(Math.sin(t/1000+s.p));sx.fillStyle=s.c;sx.beginPath();sx.arc(s.x,s.y,s.r,0,7);sx.fill()});requestAnimationFrame(d)})(0);
addEventListener("resize",()=>{sz();sz2()});

/* party poppers */
const pc=$("pop"),px=pc.getContext("2d");let P=[],pr=false;
const szp=()=>{pc.width=innerWidth;pc.height=innerHeight};szp();addEventListener("resize",szp);
function blast(){popSnd();const cols=["#ff5fa2","#ffd166","#06d6a0","#4cc9f0","#fff","#ff9e00","#b388ff"];
 [[0,1],[1,-1]].forEach(([cx,dir])=>{for(let i=0;i<70;i++){const a=Math.PI/180*(45+rnd()*35),v=(9+rnd()*11)*(innerHeight/700+.5);P.push({x:cx*pc.width,y:pc.height,vx:Math.cos(a)*v*dir,vy:-Math.sin(a)*v,w:5+rnd()*6,h:3+rnd()*5,c:cols[i%7],r:rnd()*6,vr:rnd()*.4-.2,l:1})}});
 if(!pr){pr=true;step()}}
function step(){px.clearRect(0,0,pc.width,pc.height);P.forEach(p=>{p.vy+=.35;p.vx*=.985;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l-=.006;px.save();px.globalAlpha=Math.max(p.l,0);px.translate(p.x,p.y);px.rotate(p.r);px.fillStyle=p.c;px.fillRect(-p.w/2,-p.h/2,p.w,p.h);px.restore()});
 P=P.filter(p=>p.l>0&&p.y<pc.height+40);P.length?requestAnimationFrame(step):(pr=false,px.clearRect(0,0,pc.width,pc.height))}

/* intro: shower -> countdown -> greeting -> heart -> cake */
let state="wait";
async function tick(n){$("cn").textContent=n;const c=$("count");c.classList.remove("hidden","pulse");void c.offsetWidth;c.classList.add("pulse")}
async function intro(){
 $("start").classList.add("fade-away");rate=.7;await sleep(700);$("start").classList.add("hidden");
 for(const n of [3,2,1]){await tick(n);await sleep(1000)}
 $("count").classList.add("hidden");$("musicBtn").classList.remove("hidden");startMusic();
 rainOn=false;rain.classList.add("off");$("veil").classList.add("on");
 $("wName").textContent=C.name;$("word").classList.remove("hidden");void $("word").offsetWidth;$("word").classList.add("slow");
 await sleep(5200);$("word").classList.add("hidden");
 $("heartWrap").classList.remove("hidden");await sleep(2900);
 $("veil").style.background="#ec1f45";$("heartWrap").classList.add("fade-away");
 $("charWrap").classList.remove("hidden");blast();setTimeout(blast,1400);
 await sleep(850);$("heartWrap").classList.add("hidden");await sleep(4200);
 $("charWrap").classList.add("fade-away");$("veil").classList.remove("on");await sleep(1300);
 $("charWrap").classList.add("hidden");$("veil").style.background="";
 $("album").classList.remove("hidden");$("album").classList.add("enter");state="closed";
}
$("startBtn").onclick=()=>{try{initAudio()}catch(e){}unlock();intro()};

/* album */
const SP=[0,1,2,3].map(i=>({l:ph(C.album[2*i],2*i),r:ph(C.album[2*i+1],2*i+1),t:C.texts[i]}));
let cur=0,busy=false;const PL=$("pl"),PR=$("pr");
const setSpread=i=>{PL.innerHTML=SP[i].l;PR.innerHTML=SP[i].r};
setSpread(0);$("cvBack").innerHTML=SP[0].l;
async function typeMsg(t){const el=$("msgText"),id=++typeMsg.id;el.textContent="";for(const ch of t){if(id!==typeMsg.id)return;el.textContent+=ch;await sleep(55)}}typeMsg.id=0;
async function openAlbum(){if(state!=="closed")return;state="opening";busy=true;$("bookShift").classList.add("opened");
 await sleep(500);$("msg").classList.add("show");typeMsg(SP[0].t);await sleep(900);
 $("book").classList.add("ready");$("turnHint").classList.add("show");state="open";busy=false}
$("album").addEventListener("click",openAlbum);
$("book").addEventListener("click",e=>{if(busy||state!=="open")return;
 const r=$("book").getBoundingClientRect(),next=e.clientX-r.left>r.width/2,to=cur+(next?1:-1);
 if(cur===SP.length-1&&next){closeBook();return}
 if(to<0||to>=SP.length)return;busy=true;
 const a=SP[cur],b=SP[to],f=document.createElement("div");f.className="fl "+(next?"r":"l");
 f.innerHTML=`<div>${next?a.r:a.l}</div><div class="bk">${next?b.l:b.r}</div>`;
 next?PR.innerHTML=b.r:PL.innerHTML=b.l;$("book").appendChild(f);void f.offsetWidth;
 f.style.transform=`rotateY(${next?-180:180}deg)`;typeMsg(b.t);
 setTimeout(()=>{setSpread(to);f.remove();cur=to;busy=false},920)});

/* close the book after the last page */
async function closeBook(){busy=true;state="closing";$("cvBack").innerHTML=SP[cur].l;$("msg").classList.remove("show");$("turnHint").classList.remove("show");
 $("book").classList.remove("ready");void $("book").offsetWidth;$("bookShift").classList.remove("opened");await sleep(1800);toFinale()}

/* finale: each photo rises from the bottom, shrinks into its heart slot; then the heart expands away */
[["cake",C.character],["fcake",C.character2]].forEach(([id,src])=>{if(src)$(id).outerHTML=`<img id="${id}" src="${src}" alt="">`});
const fin=$("finale"),inner=$("heartInner"),hint=$("scrollHint"),fm=$("finalMessage");
$("fcard").innerHTML=C.final.map(t=>`<p>${t}</p>`).join("")+`<button class="btn" onclick="location.reload()">Replay 🎂</button>`;
let HP=[],G=[],W=0,H=0,BH=0,sp=-1,run=false;
const sm=t=>t*t*(3-2*t);
function layout(){W=innerWidth;H=innerHeight;const Y=1.12,N=HP.length,h=N/2,M=300,pt=[],cum=[0];
 for(let m=0;m<=M;m++){const t=Math.PI*(1-m/M),x=16*Math.pow(Math.sin(t),3),y=-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))*Y;pt.push([x,y]);if(m)cum.push(cum[m-1]+Math.hypot(x-pt[m-1][0],y-pt[m-1][1]))}
 const Lh=cum[M],tu=1.4*2*Lh/N,k=Math.min(W*.92/(32+tu),H*.6/(29*Y+tu*1.25)),tw=tu*k,BW=Math.min(W*.64,300),cx=W/2,cy=H*.46;BH=BW*1.25;
 inner.style.transformOrigin=`${cx}px ${cy}px`;
 for(let j=0;j<h;j++){const f=(j+.5)/h*Lh;let m=1;while(m<M&&cum[m]<f)m++;const q=(f-cum[m-1])/(cum[m]-cum[m-1]||1),x=pt[m-1][0]+(pt[m][0]-pt[m-1][0])*q,y=pt[m-1][1]+(pt[m][1]-pt[m-1][1])*q;
  [1,-1].forEach((sd,a)=>{const i=2*j+a;G[i]={x:cx+sd*x*k,y:cy+(y-2.5*Y)*k,r:sd*(3+(j*5%7)),s:tw/BW}})}
 HP.forEach(d=>{d.style.width=BW+"px";d.style.height=BH+"px";d._f=false;d._o=-1})}
function render(p){const D=.0494,ST=.0395;
 HP.forEach((d,i)=>{const t=clamp((p-(.02+i*ST))/D);
  if(t<=0){if(d._o!==0){d.style.opacity=0;d._o=0;d._f=false}return}
  if(t>=1&&d._f)return;
  const g=G[i],u=sm(t),v=sm(clamp((t-.12)/.88)),y0=H+BH/2+20,x0=W/2+(g.x-W/2)*.25;
  d._o=1;d._f=t>=1;d.style.opacity=1;
  d.style.transform=`translate3d(${x0+(g.x-x0)*u}px,${y0+(g.y-y0)*u}px,0) translate(-50%,-50%) rotate(${g.r*v}deg) scale(${1+(g.s-1)*v})`});
 const ex=clamp((p-.85)/.11);inner.style.transform=ex?`scale(${1+7*Math.pow(ex,1.4)})`:"";inner.style.visibility=ex>=1?"hidden":"visible";
 hint.style.opacity=scrollY<30?1:0;fm.classList.toggle("visible",p>.97)}
function loop(){if(!run)return;const tg=clamp(scrollY/Math.max(1,fin.offsetHeight-innerHeight));if(Math.abs(tg-sp)>1e-4){sp=sp<0?tg:sp+(tg-sp)*.14;render(sp)}requestAnimationFrame(loop)}
async function toFinale(){$("album").classList.add("leaving");await sleep(1000);$("album").classList.add("hidden");
 inner.innerHTML="";HP=C.heart.map((s,i)=>{const d=document.createElement("div");d.className="hp";d.innerHTML=ph(s,i+3);inner.append(d);return d});
 lite=true;document.body.classList.add("lite");fin.classList.add("active");document.documentElement.classList.remove("lock");scrollTo(0,0);layout();run=true;loop()}
addEventListener("resize",()=>{if(run){layout();sp=-1}});
</script>
</body>
</html>
